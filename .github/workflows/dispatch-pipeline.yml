name: Trigger MCP Pipeline

on:
  push:
    branches: [testing, release]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to s4e-mcp-pipeline
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: |
          gh api repos/s4e-io/s4e-mcp-pipeline/dispatches \
            --method POST \
            --field event_type=source-push \
            --field client_payload='{"branch":"${{ github.ref_name }}"}'
